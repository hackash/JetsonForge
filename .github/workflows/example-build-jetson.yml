# This is an example workflow demonstrating how to use JetsonForge GitHub Action
# Copy this file to your repository's .github/workflows/ directory to use it
#
# Prerequisites:
# - A multi-stage Dockerfile in your repo root (see example below)
# - Your application source code
#
# Example Dockerfile:
# ```dockerfile
# # syntax=docker/dockerfile:1.7
# ARG L4T_CROSS_BASE=jetson-cross-base:jp6.0-orin-nano
# ARG TARGET_JETPACK_TAG=r36.3.0
# 
# # Stage 1: Cross-compile the application
# FROM ${L4T_CROSS_BASE} AS builder
# WORKDIR /app
# COPY . .
# RUN cmake -B build -S . \
#       -DCMAKE_TOOLCHAIN_FILE=/toolchains/aarch64-jetson.cmake \
#       -DCMAKE_BUILD_TYPE=Release && \
#     cmake --build build -j$(nproc)
# 
# # Stage 2: Runtime image for Jetson device
# FROM nvcr.io/nvidia/l4t-jetpack:${TARGET_JETPACK_TAG}
# COPY --from=builder /app/build/my-app /usr/local/bin/my-app
# CMD ["/usr/local/bin/my-app"]
# ```

name: Example - Build Jetson Application

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-jetson:
    runs-on: ubuntu-latest
    
    steps:
      # ============================================================
      # Step 1: Checkout Your Code
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      # ============================================================
      # Step 2: Free Disk Space (GitHub-Hosted Runners Only)
      # ⚠️ IMPORTANT: Only run this on GitHub-hosted runners!
      # ⚠️ DO NOT run on self-hosted runners as it may delete system files
      # ============================================================
      - name: Maximize Build Space (GitHub-Hosted Only)
        # Conditional: Only run if not self-hosted
        if: ${{ !contains(runner.name, 'self-hosted') }}
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 5120        # Reserve 5GB for system
          swap-size-mb: 1024            # Add 1GB swap
          remove-dotnet: 'true'         # Remove unnecessary SDKs
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
      
      # ============================================================
      # Step 3: Build JetsonForge Cross-Compiler
      # ============================================================
      - name: Build Jetson Cross-Compilation Environment
        id: jetsonforge
        uses: hackash/JetsonForge@main
        with:
          # JetPack version to use
          # See https://github.com/hackash/JetsonForge/blob/main/JETPACK-VERSIONS.md
          # for complete version compatibility matrix
          jetpack_version: '6.0'
          
          # Target Jetson device
          # Options: JETSON_ORIN_NANO_TARGETS, JETSON_AGX_ORIN_TARGETS, etc.
          jetson_target: 'JETSON_ORIN_NANO_TARGETS'
          
          # Optional: Slack webhook for authentication notifications
          # Store this in GitHub Secrets: Settings → Secrets → Actions
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          
          # Optional: Microsoft Teams webhook
          teams_webhook: ${{ secrets.TEAMS_WEBHOOK }}
          
          # Optional: Telegram bot (requires both bot_token and chat_id)
          # telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          
          # Optional: Custom image tag (auto-generated if not specified)
          # Auto-generated format: jetson-cross-base:jp{VERSION}-{TARGET}
          # Example auto-generated: jetson-cross-base:jp6.0-orin-nano
          # build_image_tag: 'my-custom-image:v1.0'
          
          # Optional: Control --archived-versions flag (default: auto)
          # Auto mode uses --archived-versions for JetPack < 6.0
          # use_archived_versions: 'auto'  # or 'true', 'false'
          
          # Optional: Increase timeout if needed (default: 300 seconds)
          # auth_timeout: '600'
      
      # ============================================================
      # Step 4: Build Production Docker Image for Jetson
      # ============================================================
      - name: Build Production Jetson Image
        run: |
          echo "Building production Docker image for Jetson deployment..."
          
          # Your Dockerfile should use multi-stage build:
          # Stage 1: Cross-compile using the JetsonForge image
          # Stage 2: Create minimal runtime image based on NVIDIA L4T
          
          CROSS_BASE="${{ steps.jetsonforge.outputs.docker_image }}"
          IMAGE_NAME="my-jetson-app"
          IMAGE_TAG="${{ github.sha }}"
          
          echo "Cross-compilation base: $CROSS_BASE"
          echo "Building: $IMAGE_NAME:$IMAGE_TAG"
          
          docker build \
            --build-arg L4T_CROSS_BASE="$CROSS_BASE" \
            --build-arg TARGET_JETPACK_TAG=r36.3.0 \
            -t "$IMAGE_NAME:$IMAGE_TAG" \
            -t "$IMAGE_NAME:latest" \
            -f Dockerfile \
            .
          
          echo "✅ Docker image built successfully"
          docker images | grep "$IMAGE_NAME"
      
      # ============================================================
      # Step 5: Push to Container Registry
      # ============================================================
      # Choose ONE of the following registry options:
      
      # Option 1: GitHub Container Registry (GHCR)
      - name: Push to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Pushing to GitHub Container Registry..."
          
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/my-jetson-app"
          
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          docker tag my-jetson-app:${{ github.sha }} "$IMAGE_NAME:${{ github.sha }}"
          docker tag my-jetson-app:latest "$IMAGE_NAME:latest"
          
          docker push "$IMAGE_NAME:${{ github.sha }}"
          docker push "$IMAGE_NAME:latest"
          
          echo "✅ Pushed to $IMAGE_NAME"
      
      # Option 2: AWS ECR (Uncomment if using AWS)
      # - name: Configure AWS Credentials
      #   if: github.ref == 'refs/heads/main'
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     aws-region: us-east-1
      # 
      # - name: Login to Amazon ECR
      #   if: github.ref == 'refs/heads/main'
      #   id: login-ecr
      #   uses: aws-actions/amazon-ecr-login@v2
      # 
      # - name: Push to Amazon ECR
      #   if: github.ref == 'refs/heads/main'
      #   run: |
      #     ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
      #     ECR_REPOSITORY=my-jetson-app
      #     
      #     docker tag my-jetson-app:${{ github.sha }} "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
      #     docker tag my-jetson-app:latest "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
      #     
      #     docker push "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
      #     docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
      # 
      # Option 3: Docker Hub (Uncomment if using Docker Hub)
      # - name: Login to Docker Hub
      #   if: github.ref == 'refs/heads/main'
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}
      # 
      # - name: Push to Docker Hub
      #   if: github.ref == 'refs/heads/main'
      #   run: |
      #     DOCKERHUB_REPO="myusername/my-jetson-app"
      #     
      #     docker tag my-jetson-app:${{ github.sha }} "$DOCKERHUB_REPO:${{ github.sha }}"
      #     docker tag my-jetson-app:latest "$DOCKERHUB_REPO:latest"
      #     
      #     docker push "$DOCKERHUB_REPO:${{ github.sha }}"
      #     docker push "$DOCKERHUB_REPO:latest"
      
      # ============================================================
      # Step 6: Deploy to Jetson Device (Optional)
      # ============================================================
      # Uncomment if you have a Jetson device accessible for testing
      # - name: Deploy and Test on Jetson
      #   if: github.ref == 'refs/heads/main'
      #   run: |
      #     # Pull and run the image on your Jetson device
      #     ssh jetson@${{ secrets.JETSON_DEVICE_IP }} << 'EOF'
      #       docker pull ghcr.io/${{ github.repository_owner }}/my-jetson-app:latest
      #       docker stop my-jetson-app || true
      #       docker rm my-jetson-app || true
      #       docker run -d --name my-jetson-app \
      #         --runtime nvidia \
      #         --restart unless-stopped \
      #         ghcr.io/${{ github.repository_owner }}/my-jetson-app:latest
      #     EOF
      
      # ============================================================
      # Step 7: Show Build Summary
      # ============================================================
      - name: Display Build Summary
        run: |
          echo "## 🚀 JetsonForge Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Cross-Compilation Environment" >> $GITHUB_STEP_SUMMARY
          echo "✅ Docker image: **${{ steps.jetsonforge.outputs.docker_image }}**" >> $GITHUB_STEP_SUMMARY
          echo "✅ Sysroot: **${{ steps.jetsonforge.outputs.sysroot_path }}**" >> $GITHUB_STEP_SUMMARY
          echo "✅ SDK Session cached: **${{ steps.jetsonforge.outputs.cache_hit_session }}**" >> $GITHUB_STEP_SUMMARY
          echo "✅ Sysroot cached: **${{ steps.jetsonforge.outputs.cache_hit_sysroot }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Production Image" >> $GITHUB_STEP_SUMMARY
          echo "📦 **my-jetson-app:${{ github.sha }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment" >> $GITHUB_STEP_SUMMARY
          echo "To run on your Jetson device:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/${{ github.repository_owner }}/my-jetson-app:latest" >> $GITHUB_STEP_SUMMARY
          echo "docker run -d --runtime nvidia ghcr.io/${{ github.repository_owner }}/my-jetson-app:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
