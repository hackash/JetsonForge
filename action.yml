name: 'JetsonForge Cross-Compiler'
description: 'Build NVIDIA Jetson cross-compilation Docker images with cached sysroots and SDK authentication. Supports Slack, Teams, and Telegram notifications.'
author: 'JetsonForge Contributors'

branding:
  icon: 'box'
  color: 'green'

inputs:
  jetpack_version:
    description: |
      JetPack version to download and build. Examples: 6.0, 5.1.2, 4.6.4
      Common versions: 6.0 (Orin), 5.1.2 (Xavier/Orin), 4.6.4 (Nano/TX2)
      See JETPACK-VERSIONS.md for complete compatibility matrix
    required: false
    default: '6.0'

  jetson_target:
    description: |
      Target Jetson device identifier for SDK Manager.
      Orin: JETSON_ORIN_NANO_TARGETS, JETSON_AGX_ORIN_TARGETS, JETSON_ORIN_NX_TARGETS
      Xavier: JETSON_AGX_XAVIER_TARGETS, JETSON_XAVIER_NX_TARGETS
      Legacy: JETSON_NANO_TARGETS, JETSON_TX2_TARGETS
      See JETPACK-VERSIONS.md for device compatibility
    required: false
    default: 'JETSON_ORIN_NANO_TARGETS'

  slack_webhook:
    description: 'Slack incoming webhook URL for authentication notifications (optional)'
    required: false
    default: ''

  teams_webhook:
    description: 'Microsoft Teams incoming webhook URL for authentication notifications (optional)'
    required: false
    default: ''

  telegram_bot_token:
    description: 'Telegram bot token for authentication notifications (optional, requires telegram_chat_id)'
    required: false
    default: ''

  telegram_chat_id:
    description: 'Telegram chat ID for authentication notifications (optional, requires telegram_bot_token)'
    required: false
    default: ''

  build_image_tag:
    description: |
      Docker image tag for the built cross-compilation base image.
      If not specified, automatically generated as: jetson-cross-base:jp{VERSION}-{TARGET}
      Example: jetson-cross-base:jp6.0-orin-nano
      Custom example: my-registry.com/jetson-builder:v1.0
    required: false
    default: ''

  download_folder:
    description: 'Directory where SDK Manager downloads JetPack files'
    required: false
    default: '~/jetpack-downloads'

  work_folder:
    description: 'Working directory for building the sysroot'
    required: false
    default: '~/jetpack-work'

  sysroot_output:
    description: 'Output path for the generated sysroot archive'
    required: false
    default: '~/jetpack-sysroot.tar.zst'

  auth_timeout:
    description: 'Maximum time in seconds to wait for NVIDIA authentication (default: 300)'
    required: false
    default: '300'

  skip_authentication:
    description: 'Skip SDK Manager authentication check (use if credentials are pre-configured)'
    required: false
    default: 'false'

  skip_sysroot_build:
    description: 'Skip sysroot generation (use if sysroot is restored from cache or provided externally)'
    required: false
    default: 'false'

  cache_key_suffix:
    description: 'Additional suffix for cache keys to force cache invalidation'
    required: false
    default: ''

  use_archived_versions:
    description: |
      Control SDK Manager --archived-versions flag for downloading older JetPack releases.
      Options: 'auto' (smart detection), 'true' (always use), 'false' (never use)
      Auto mode uses --archived-versions for JetPack < 6.0
    required: false
    default: 'auto'

outputs:
  docker_image:
    description: 'Tag of the built Docker cross-compilation image'
    value: ${{ steps.docker-build.outputs.image_tag }}

  sysroot_path:
    description: 'Path to the generated sysroot archive'
    value: ${{ steps.sysroot-build.outputs.sysroot_path }}

  cache_hit_session:
    description: 'Whether SDK Manager session was restored from cache'
    value: ${{ steps.cache-session.outputs.cache-hit }}

  cache_hit_sysroot:
    description: 'Whether sysroot was restored from cache'
    value: ${{ steps.cache-sysroot.outputs.cache-hit }}

runs:
  using: 'composite'
  steps:

    # ============================================================
    # Prelude: Ensure all action scripts are executable
    # ============================================================
    - name: Prepare Scripts
      shell: bash
      run: chmod +x "${{ github.action_path }}/scripts/"*.sh

    # ============================================================
    # Step 1: Install Required System Dependencies
    # ============================================================
    - name: Install System Dependencies
      shell: bash
      run: "${{ github.action_path }}/scripts/install-deps.sh"

    # ============================================================
    # Step 2: Validate JetPack Version & Target Compatibility
    # ============================================================
    - name: Validate JetPack Configuration
      shell: bash
      env:
        JP_VERSION: ${{ inputs.jetpack_version }}
        TARGET: ${{ inputs.jetson_target }}
      run: "${{ github.action_path }}/scripts/validate-config.sh"

    # ============================================================
    # Step 3: Expand Input Paths
    # ============================================================
    - name: Expand Input Paths
      id: expand-paths
      shell: bash
      env:
        DOWNLOAD_FOLDER: ${{ inputs.download_folder }}
        WORK_FOLDER: ${{ inputs.work_folder }}
        SYSROOT_OUTPUT: ${{ inputs.sysroot_output }}
      run: "${{ github.action_path }}/scripts/expand-paths.sh"

    # ============================================================
    # Step 4: Compute Docker Image Tag
    # ============================================================
    - name: Compute Docker Image Tag
      id: compute-tag
      shell: bash
      env:
        USER_TAG: ${{ inputs.build_image_tag }}
        JP_VERSION: ${{ inputs.jetpack_version }}
        TARGET: ${{ inputs.jetson_target }}
      run: "${{ github.action_path }}/scripts/compute-tag.sh"

    # ============================================================
    # Step 5: Cache SDK Manager Session
    # ============================================================
    - name: Cache SDK Manager Session
      id: cache-session
      uses: actions/cache@v4
      with:
        path: |
          ~/.nvsdkm
          ~/.config/sdkmanager
        key: nvsdkm-session-${{ inputs.jetpack_version }}-${{ inputs.cache_key_suffix }}
        restore-keys: |
          nvsdkm-session-${{ inputs.jetpack_version }}-
          nvsdkm-session-

    # ============================================================
    # Step 6: Install NVIDIA SDK Manager
    # ============================================================
    - name: Install NVIDIA SDK Manager
      shell: bash
      run: "${{ github.action_path }}/scripts/install-sdkmanager.sh"

    # ============================================================
    # Step 8: Cache JetPack Downloads
    # ============================================================
    - name: Cache JetPack Downloads
      id: cache-downloads
      uses: actions/cache@v4
      with:
        path: ${{ steps.expand-paths.outputs.download_folder }}
        key: jetpack-downloads-${{ inputs.jetpack_version }}-${{ inputs.jetson_target }}-${{ inputs.cache_key_suffix }}
        restore-keys: |
          jetpack-downloads-${{ inputs.jetpack_version }}-${{ inputs.jetson_target }}-
          jetpack-downloads-${{ inputs.jetpack_version }}-

    # ============================================================
    # Step 9: Download JetPack Files
    # ============================================================
    - name: Download JetPack Files
      if: steps.cache-downloads.outputs.cache-hit != 'true'
      shell: bash
      env:
        DOWNLOAD_FOLDER: ${{ steps.expand-paths.outputs.download_folder }}
        JP_VERSION: ${{ inputs.jetpack_version }}
        JETSON_TARGET: ${{ inputs.jetson_target }}
        USE_ARCHIVED: ${{ inputs.use_archived_versions }}
        SLACK_WEBHOOK_URL: ${{ inputs.slack_webhook }}
        TEAMS_WEBHOOK_URL: ${{ inputs.teams_webhook }}
        TELEGRAM_BOT_TOKEN: ${{ inputs.telegram_bot_token }}
        TELEGRAM_CHAT_ID: ${{ inputs.telegram_chat_id }}
        AUTH_TIMEOUT: ${{ inputs.auth_timeout }}
      run: "${{ github.action_path }}/scripts/download-jetpack.sh"

    # ============================================================
    # Step 10: Cache Built Sysroot
    # ============================================================
    - name: Cache Sysroot Archive
      id: cache-sysroot
      uses: actions/cache@v4
      with:
        path: ${{ steps.expand-paths.outputs.sysroot_output }}
        key: jetpack-sysroot-${{ inputs.jetpack_version }}-${{ inputs.jetson_target }}-${{ inputs.cache_key_suffix }}-${{ hashFiles(format('{0}/*.deb', steps.expand-paths.outputs.download_folder)) }}
        restore-keys: |
          jetpack-sysroot-${{ inputs.jetpack_version }}-${{ inputs.jetson_target }}-${{ inputs.cache_key_suffix }}-
          jetpack-sysroot-${{ inputs.jetpack_version }}-${{ inputs.jetson_target }}-

    # ============================================================
    # Step 11: Build Sysroot
    # ============================================================
    - name: Build Sysroot
      id: sysroot-build
      if: steps.cache-sysroot.outputs.cache-hit != 'true' && inputs.skip_sysroot_build != 'true'
      shell: bash
      env:
        JETSON_FORGE_DL: ${{ steps.expand-paths.outputs.download_folder }}
        JETSON_FORGE_WORK: ${{ steps.expand-paths.outputs.work_folder }}
        JETSON_FORGE_OUT: ${{ steps.expand-paths.outputs.sysroot_output }}
      run: |
        "${{ github.action_path }}/scripts/make-sys-root.sh"
        echo "sysroot_path=$JETSON_FORGE_OUT" >> "$GITHUB_OUTPUT"

    - name: Set Sysroot Output (from cache)
      id: sysroot-cached
      if: steps.cache-sysroot.outputs.cache-hit == 'true'
      shell: bash
      run: |
        SYSROOT_PATH="${{ steps.expand-paths.outputs.sysroot_output }}"
        echo "Sysroot restored from cache: $SYSROOT_PATH"
        echo "sysroot_path=$SYSROOT_PATH" >> "$GITHUB_OUTPUT"

    # ============================================================
    # Step 12: Copy Sysroot to Repository
    # ============================================================
    - name: Copy Sysroot to Repository
      id: copy-sysroot
      shell: bash
      env:
        SYSROOT_SRC: ${{ steps.expand-paths.outputs.sysroot_output }}
        ACTION_PATH: ${{ github.action_path }}
      run: "${{ github.action_path }}/scripts/copy-sysroot.sh"

    # ============================================================
    # Step 13: Build Docker Cross-Compilation Image
    # ============================================================
    - name: Build Docker Image
      id: docker-build
      shell: bash
      env:
        SYSROOT_BASENAME: ${{ steps.copy-sysroot.outputs.sysroot_basename }}
        IMAGE_TAG: ${{ steps.compute-tag.outputs.image_tag }}
        ACTION_PATH: ${{ github.action_path }}
      run: "${{ github.action_path }}/scripts/build-docker.sh"

    # ============================================================
    # Step 14: Verify Docker Image
    # ============================================================
    - name: Verify Docker Image
      shell: bash
      env:
        IMAGE_TAG: ${{ steps.compute-tag.outputs.image_tag }}
      run: "${{ github.action_path }}/scripts/verify-docker.sh"

    # ============================================================
    # Step 15: Cleanup
    # ============================================================
    - name: Cleanup Temporary Files
      if: always()
      shell: bash
      env:
        SYSROOT_BASENAME: ${{ steps.copy-sysroot.outputs.sysroot_basename }}
        ACTION_PATH: ${{ github.action_path }}
        WORK_FOLDER: ${{ steps.expand-paths.outputs.work_folder }}
      run: "${{ github.action_path }}/scripts/cleanup.sh"
